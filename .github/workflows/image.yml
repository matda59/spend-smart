name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/matda59/spend-smart

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/matda59/spend-smart
            org.opencontainers.image.description=Household budget planner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api /user/packages?package_type=container --jq '.[] | {name, visibility}' || true
          for path in \
            /user/packages/container/spend-smart/visibility \
            /users/${{ github.repository_owner }}/packages/container/spend-smart/visibility
          do
            if gh api --method PATCH "$path" -f visibility=public; then
              exit 0
            fi
          done
          echo "The image is published. Package visibility is already set on the GitHub account."
          exit 0
