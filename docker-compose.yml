# Unraid: do not start this file from the terminal. Add the container from the Docker page.
# See the Unraid section of the README. This file is for a local Docker build.
services:
  household:
    build: .
    image: ghcr.io/matda59/spend-smart:latest
    ports:
      - "3847:3847"
    environment:
      PORT: "3847"
      HOSTNAME: "0.0.0.0"
      DATABASE_PATH: /data/budget.sqlite
      # Uncomment and set this before the app is reachable beyond your home network.
      # BUDGET_PASSWORD: "choose-a-long-passphrase"
    volumes:
      # The budget database. On Unraid this is a folder on your array, not part of the image.
      - ${BUDGET_DATA_DIR:-./data}:/data
    restart: unless-stopped
